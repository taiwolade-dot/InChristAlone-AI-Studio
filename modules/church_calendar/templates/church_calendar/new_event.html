{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

<h2>Add Church Programme / Event</h2>

<form method="POST">

<div class="mb-3">
<label>Event Title</label>
<input type="text" name="title" class="form-control" required>
</div>

<div class="mb-3">
<label>Category</label>
<input type="text" name="category" class="form-control" value="Church">
</div>

<div class="mb-3">
<label>Level</label>
<select name="level" class="form-control">
<option>Local Church</option>
<option>Association</option>
<option>Conference</option>
<option>Convention</option>
</select>
</div>

<div class="mb-3">
<label>Organization Name</label>
<input type="text" name="organization_name" class="form-control">
</div>

<div class="mb-3">
<label>Ministry</label>
<input type="text" name="ministry" class="form-control">
</div>

<div class="mb-3">
<label>Description</label>
<textarea name="description" class="form-control"></textarea>
</div>

<div class="mb-3">
<label>Venue</label>
<input type="text" name="venue" class="form-control">
</div>

<div class="mb-3">
<label>Location</label>
<input type="text" name="location" class="form-control">
</div>

<div class="mb-3">
<label>Association</label>
<input type="text" name="association" class="form-control">
</div>

<div class="mb-3">
<label>Conference</label>
<input type="text" name="conference" class="form-control">
</div>

<div class="mb-3">
<label>Convention</label>
<input type="text" name="convention" class="form-control">
</div>

<div class="mb-3">
<label>Organizer</label>
<input type="text" name="organizer" class="form-control">
</div>

<div class="mb-3">
<label>Start Date and Time</label>
<input type="datetime-local" name="start_datetime" class="form-control" required>
</div>

<button class="btn btn-primary">
Save Event
</button>

</form>

</div>

{% endblock %}
