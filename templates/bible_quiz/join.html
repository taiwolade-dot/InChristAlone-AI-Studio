{% extends "base.html" %}

{% block content %}
<div class="container" style="max-width:600px;margin:40px auto;">
    <div class="card" style="padding:30px;text-align:center;">
        <h1>🎯 Join Bible Quiz</h1>

        <h2>{{ quiz_session.quiz.title }}</h2>

        <p>
            Enter your name to join this live quiz.
        </p>

        <form method="POST">
            <div style="margin:20px 0;">
                <label for="name">Your Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                    maxlength="80"
                    placeholder="Enter your name"
                    style="width:100%;padding:12px;margin-top:8px;"
                >
            </div>

            <input type="hidden" name="avatar_color" value="#d4af37">

            <button type="submit" style="padding:12px 25px;">
                Join Quiz
            </button>
        </form>
    </div>
</div>
{% endblock %}
