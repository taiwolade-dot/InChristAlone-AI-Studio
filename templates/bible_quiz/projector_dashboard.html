<!DOCTYPE html>
<html>
<head>
<title>Bible Quiz Projector</title>

<style>
body {
    margin:0;
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
}

.container {
    padding:40px;
}

h1 {
    font-size:50px;
}

.question {
    font-size:40px;
    margin:30px;
}

.options {
    font-size:32px;
    text-align:left;
    max-width:800px;
    margin:auto;
}

.option {
    padding:15px;
    margin:10px;
    background:#222;
    border-radius:10px;
}

.timer {
    font-size:80px;
    color:#ffd700;
}

.progress {
    font-size:30px;
}

.leaderboard {
    position:absolute;
    right:30px;
    top:30px;
    background:#222;
    padding:20px;
    border-radius:15px;
}

.qr-box {
    position:absolute;
    left:30px;
    top:30px;
    background:#222;
    padding:20px;
    border-radius:15px;
}

.qr-box img {
    background:white;
    padding:10px;
}

.host-btn {
    position:absolute;
    right:30px;
    bottom:30px;
    background:#333;
    color:white;
    padding:12px 18px;
    border-radius:8px;
    text-decoration:none;
    font-size:18px;
    opacity:0.7;
}

.host-btn:hover {
    opacity:1;
}

</style>

</head>

<body>

<div class="container">


<a href="{{ url_for('bible_quiz_session.host_panel', session_id=quiz_session.id) }}"
   class="host-btn">
   🎛 Host Panel
</a>

<h1>📖 BIBLE QUIZ CHALLENGE</h1>
<div class="qr-box">
    <h2>📱 Scan to Join</h2>

    <img src="data:image/png;base64,{{ qr_code }}"
         width="180"
         alt="Join QR Code">

    <h3>PIN: {{ quiz_session.pin_code }}</h3>

<p style="font-size:14px; word-break:break-all;">
    {{ join_url }}
</p>
</div>



<div class="progress" id="progress"></div>

<div class="question" id="question">
Waiting...
</div>


<div class="options" id="options"></div>


<div class="timer" id="timer">
20
</div>


<div class="leaderboard">

<h2>🏆 Top 5</h2>

<div id="leaders"></div>

</div>


</div>


<script>

const sessionId = {{ quiz_session.id }};


function updateProjector(){

fetch(`/api/bible-quiz/session/${sessionId}/state`)

.then(r=>r.json())

.then(data=>{


if(data.status==="finished"){

let finalBoard = "";

data.leaderboard.slice(0,3).forEach((p,i)=>{
    const medal =
        i===0 ? "🥇" :
        i===1 ? "🥈" :
        "🥉";

    finalBoard += `
        <h2>${medal} #${i+1} ${p.name} — ${p.score} pts</h2>
    `;
});

document.body.innerHTML =
`
<div style="text-align:center;margin-top:120px;">
<h1 style="font-size:80px;">
🎉 QUIZ COMPLETE 🎉
</h1>

<h2>🏆 Final Winners</h2>

${finalBoard}

</div>
`;

return;

}


document.getElementById("progress").innerHTML =
`Question ${data.current_question_index + 1} of ${data.total_questions}`;


if(data.question){

document.getElementById("question").innerHTML =
data.question.text;


let html="";

data.question.options.forEach((o,i)=>{

html += `
<div class="option">
${String.fromCharCode(65+i)}. ${o}
</div>
`;

});


document.getElementById("options").innerHTML=html;


document.getElementById("timer").innerHTML =
data.question.seconds;


}



let leaders="";

data.leaderboard.slice(0,5).forEach((p,i)=>{

const medal =
    i===0 ? "🥇" :
    i===1 ? "🥈" :
    i===2 ? "🥉" : "🏅";

leaders += `
<p>
${medal} #${i+1} ${p.name} — ${p.score} pts
</p>
`;

});


document.getElementById("leaders").innerHTML=leaders;



});


}


setInterval(updateProjector,1000);

updateProjector();


</script>


</body>
</html>
