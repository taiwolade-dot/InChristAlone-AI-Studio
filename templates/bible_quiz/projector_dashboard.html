<!DOCTYPE html>
<html>
<head>
<title>Bible Quiz Projector</title>

<style>
body {
    margin:0;
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
}

.container {
    padding:50px;
}

h1 {
    font-size:60px;
}

.question {
    font-size:55px;
    margin:40px;
    transition: opacity 0.5s ease-in-out;
}

.fade-out {
    opacity:0;
}

.fade-in {
    opacity:1;
}

.options {
    font-size:38px;
    text-align:left;
    max-width:800px;
    margin:auto;
}

.option {
    padding:20px;
    margin:10px;
    background:#222;
    border-radius:10px;
}

.timer {
    font-size:80px;
    color:#ffd700;
}

.progress {
    font-size:30px;
}

.leaderboard {
    position:absolute;
    right:30px;
    top:30px;
    background:#222;
    padding:20px;
    border-radius:15px;
}

.qr-box {
    position:absolute;
    left:30px;
    top:30px;
    background:#222;
    padding:20px;
    border-radius:15px;
}

.qr-box img {
    background:white;
    padding:10px;
}




.countdown-overlay {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.9);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:2000;
    flex-direction:column;
}

.countdown-number {
    font-size:180px;
    font-weight:bold;
    color:#ffd700;
    animation:pulse 1s ease-in-out;
}

.countdown-text {
    font-size:60px;
    margin-bottom:20px;
}

@keyframes pulse {
    0% {
        transform:scale(0.5);
        opacity:0;
    }

    50% {
        transform:scale(1.2);
        opacity:1;
    }

    100% {
        transform:scale(1);
        opacity:1;
    }
}

</style>

</head>

<body>


<div class="countdown-overlay" id="countdownOverlay">

    <div class="countdown-text">
        GET READY
    </div>

    <div class="countdown-number" id="countdownNumber">
        3
    </div>

</div>

<div class="container">




<h1>📖 BIBLE QUIZ CHALLENGE</h1>

<button id="fullscreenBtn"
onclick="openFullscreen()"
style="
position:fixed;
top:20px;
right:20px;
z-index:999;
font-size:18px;
padding:12px 18px;
border-radius:8px;
border:none;
cursor:pointer;
">
🖥 Full Screen
</button>
{% if quiz_session.status == "waiting" %}
<div class="qr-box" id="qrBox">
    <h2>📱 Scan to Join</h2>

    <img src="data:image/png;base64,{{ qr_code }}"
         width="180"
         alt="Join QR Code">

    <h3>PIN: {{ quiz_session.pin_code }}</h3>

    <p style="font-size:14px; word-break:break-all;">
        {{ join_url }}
    </p>
</div>
{% endif %}



<div class="progress" id="progress"></div>

{% if quiz_session.status == "waiting" %}

<div class="question" id="question">
    ⏳ Waiting for host to start the quiz...
</div>

<div class="options" id="options"></div>

<div class="timer" id="timer" style="display:none;">
</div>

{% else %}

<div class="question" id="question">
Waiting...
</div>

<div class="options" id="options"></div>

<div class="timer" id="timer">
</div>

{% endif %}




<div class="leaderboard">

<h2>🏆 Top 5</h2>

<div id="leaders"></div>

</div>


</div>


<script>

const sessionId = {{ quiz_session.id }};



function runCountdown(callback){

    const overlay = document.getElementById("countdownOverlay");
    const number = document.getElementById("countdownNumber");

    if(!overlay || !number){
        callback();
        return;
    }

    overlay.style.display = "flex";

    let count = 3;

    number.innerText = count;

    const timer = setInterval(function(){

        count--;

        if(count > 0){

            number.innerText = count;

        }else{

            clearInterval(timer);

            overlay.style.display = "none";

            callback();

        }

    },1000);

}


let lastDisplayedQuestion = null;


function updateProjector(){

fetch(`/api/bible-quiz/session/${sessionId}/state`)

.then(r=>r.json())

.then(data=>{


if(data.status==="waiting"){

    document.getElementById("progress").innerHTML = "";

const projectorTimer = document.getElementById("timer");

if(projectorTimer && data.question){
    projectorTimer.style.display = "block";
    projectorTimer.innerHTML =
        Number(data.question.seconds) > 0
            ? data.question.seconds + "s"
            : "⏰ Time Up!";
}


    document.getElementById("question").innerHTML =
    "⏳ Waiting for host to start the quiz...";

    document.getElementById("options").innerHTML = "";

document.getElementById("timer").style.display = "none";
    document.getElementById("timer").innerHTML = "";

    return;

}


if(data.status==="finished"){

let finalBoard = "";

data.leaderboard.slice(0,3).forEach((p,i)=>{
    const medal =
        i===0 ? "🥇" :
        i===1 ? "🥈" :
        "🥉";

    finalBoard += `
        <h2>${medal} #${i+1} ${p.name} — ${p.score} pts</h2>
    `;
});

document.body.innerHTML =
`
<div style="text-align:center;margin-top:120px;">
<h1 style="font-size:80px;">
🎉 QUIZ COMPLETE 🎉
</h1>

<h2>🏆 Final Winners</h2>

${finalBoard}

</div>
`;

return;

}


const qr = document.getElementById("qrBox");

if(qr && data.status === "waiting"){
    qr.style.display = "block";
}

if(qr && data.status !== "waiting"){
    qr.style.display = "none";
}

document.getElementById("progress").innerHTML =
`Question ${data.current_question_index + 1} of ${data.total_questions}`;


if(data.question && data.question.question_id !== lastDisplayedQuestion){

lastDisplayedQuestion = data.question.question_id;

const questionBox = document.getElementById("question");

runCountdown(function(){

questionBox.classList.add("fade-out");

setTimeout(function(){

    questionBox.innerHTML = data.question.text;

    questionBox.classList.remove("fade-out");
    questionBox.classList.add("fade-in");

},300);

});


let html="";

data.question.options.forEach((o,i)=>{

html += `
<div class="option">
${String.fromCharCode(65+i)}. ${o}
</div>
`;

});


document.getElementById("options").innerHTML=html;





}



let leaders="";

data.leaderboard.slice(0,5).forEach((p,i)=>{

const medal =
    i===0 ? "🥇" :
    i===1 ? "🥈" :
    i===2 ? "🥉" : "🏅";

leaders += `
<p>
${medal} #${i+1} ${p.name} — ${p.score} pts
</p>
`;

});


document.getElementById("leaders").innerHTML=leaders;



});


}


setInterval(updateProjector,1000);

updateProjector();




window.addEventListener("load", function(){

    const btn = document.getElementById("fullscreenBtn");

    if(btn){
        btn.style.display = "block";
    }

});


document.addEventListener("fullscreenchange", function(){
    const btn = document.getElementById("fullscreenBtn");
    if(!btn) return;

    if(document.fullscreenElement){
        btn.style.display = "none";
    }else{
        btn.style.display = "block";
    }
});



function openFullscreen(){
    const elem = document.documentElement;

    if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(function(error){
            console.log("Fullscreen request was blocked:", error);
        });
    } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
    } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
    }
}




</script>





</body>

</html>
