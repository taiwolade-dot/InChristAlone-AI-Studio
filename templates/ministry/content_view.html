{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>📖 Ministry Content View</h2>

    <div class="card mt-3">
        <div class="card-body">

            <h4>{{ content.title }}</h4>

            <p>
                <strong>Type:</strong>
                {{ content.content_type }}
            </p>

            <p>
                <strong>Status:</strong>
                {{ content.status or "Draft" }}
            </p>

            <div class="mb-3">

                <a class="btn-secondary"
                   href="{{ url_for('ministry.submit_content_review', content_id=content.id) }}">
                    📝 Submit for Review
                </a>

                <a class="btn-secondary"
                   href="{{ url_for('ministry.approve_content', content_id=content.id) }}">
                    ✅ Approve
                </a>

                <a class="btn-secondary"
                   href="{{ url_for('ministry.reject_content', content_id=content.id) }}">
                    ↩ Return for Revision
                </a>

            </div>

            <hr>

            <p style="white-space: pre-line;">
                {{ content.content }}
            </p>

            <a class="btn-secondary"
               href="{{ url_for('ministry.content_history', content_id=content.id) }}">
                🕘 Version History
            </a>

            <a class="btn-secondary"
               href="{{ url_for('ministry.content_library') }}">
                ← Back to Library
            </a>

        </div>
    </div>

</div>

{% endblock %}
