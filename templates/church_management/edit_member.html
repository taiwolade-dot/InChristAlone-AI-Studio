{% extends "base.html" %}

{% block title %}Edit Member — InChristAlone AI Studio{% endblock %}

{% block content %}
<section class="auth-form" style="max-width:500px;">
    <h2>Edit Church Member</h2>

    <form method="POST" action="{{ url_for('church_management.edit_member', member_id=member.id) }}">
        <div class="form-group">
            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" value="{{ member.full_name }}" required>
        </div>
        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="text" id="phone" name="phone" value="{{ member.phone or '' }}">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ member.email or '' }}">
        </div>
        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" value="{{ member.address or '' }}">
        </div>
        <div class="form-group">
            <label for="church_role">Church Role</label>
            <input type="text" id="church_role" name="church_role" value="{{ member.church_role or '' }}">
        </div>
        <div class="form-group">
            <label for="date_joined">Date Joined</label>
            <input type="date" id="date_joined" name="date_joined" value="{{ member.date_joined or '' }}">
        </div>
        <div class="form-group">
            <label for="birthday">Birthday</label>
           <input type="date" id="birthday" name="birthday" value="{{ member.birthday or '' }}">
        </div>
        <div class="form-group">
            <label for="marital_status">Marital Status</label>
            <select id="marital_status" name="marital_status">
                <option value="">Select Status</option>
                <option value="Single" {% if member.marital_status == 'Single' %}selected{% endif %}>Single</option>
                <option value="Married" {% if member.marital_status == 'Married' %}selected{% endif %}>Married</option>
                <option value="Divorced" {% if member.marital_status == 'Divorced' %}selected{% endif %}>Divorced</option>
                <option value="Widowed" {% if member.marital_status == 'Widowed' %}selected{% endif %}>Widowed</option>
            </select>
        </div>
        <div class="form-group">
            <label for="age_range">Age Range</label>
            <select id="age_range" name="age_range">
                <option value="">Select Age Range</option>
                <option value="Under 18" {% if member.age_range == 'Under 18' %}selected{% endif %}>Under 18</option>
                <option value="18-25" {% if member.age_range == '18-25' %}selected{% endif %}>18-25</option>
                <option value="26-35" {% if member.age_range == '26-35' %}selected{% endif %}>26-35</option>
                <option value="36-50" {% if member.age_range == '36-50' %}selected{% endif %}>36-50</option>
                <option value="50+" {% if member.age_range == '50+' %}selected{% endif %}>50+</option>
            </select>
        </div>
        <div class="form-group">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="3">{{ member.notes or '' }}</textarea>
        </div>

        <button type="submit" class="btn-primary btn-full">Save Changes</button>
    </form>

    <p class="auth-switch">
        <a href="{{ url_for('church_management.index') }}">← Back to Member List</a>
    </p>
</section>
{% endblock %}
