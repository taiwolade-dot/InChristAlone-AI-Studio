{% extends "base.html" %}

{% block title %}Add Member — InChristAlone AI Studio{% endblock %}

{% block content %}
<section class="auth-form" style="max-width:500px;">
    <h2>Add Church Member</h2>

    <form method="POST" action="{{ url_for('church_management.add_member') }}">
        <div class="form-group">
            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" required>
        </div>
        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="text" id="phone" name="phone">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email">
        </div>
        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="address">
        </div>
        <div class="form-group">
            <label for="church_role">Church Role</label>
            <input type="text" id="church_role" name="church_role" placeholder="e.g. Deacon, Choir, Usher">
        </div>
        <div class="form-group">
            <label for="date_joined">Date Joined</label>
            <input type="date" id="date_joined" name="date_joined">
        </div>
        <div class="form-group">
            <label for="birthday">Birthday</label>
           <input type="date" id="birthday" name="birthday">
       </div>
        <div class="form-group">
            <label for="marital_status">Marital Status</label>
            <select id="marital_status" name="marital_status">
                <option value="">Select Status</option>
                <option value="Single">Single</option>
                <option value="Married">Married</option>
                <option value="Divorced">Divorced</option>
                <option value="Widowed">Widowed</option>
            </select>
        </div>
        <div class="form-group">
            <label for="age_range">Age Range</label>
            <select id="age_range" name="age_range">
                <option value="">Select Age Range</option>
                <option value="Under 18">Under 18</option>
                <option value="18-25">18-25</option>
                <option value="26-35">26-35</option>
                <option value="36-50">36-50</option>
                <option value="50+">50+</option>
            </select>
        </div>
        <div class="form-group">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="3"></textarea>
        </div>

        <button type="submit" class="btn-primary btn-full">Add Member</button>
    </form>

    <p class="auth-switch">
        <a href="{{ url_for('church_management.index') }}">← Back to Member List</a>
    </p>
</section>
{% endblock %}
