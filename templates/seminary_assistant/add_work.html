{% extends "base.html" %}

{% block title %}Add Item — Seminary Assistant{% endblock %}

{% block content %}
<section class="auth-form" style="max-width:500px;">
    <h2>Add Thesis/Seminar/Assignment Item</h2>

    <form method="POST" action="{{ url_for('seminary_assistant.add_work') }}">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required>
        </div>

        <div class="form-group">
            <label for="work_type">Type</label>
            <select id="work_type" name="work_type">
                {% for key, label in work_types.items() %}
                    <option value="{{ key }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="status">Status</label>
            <select id="status" name="status">
                {% for key, label in work_statuses.items() %}
                    <option value="{{ key }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="deadline">Deadline</label>
            <input type="date" id="deadline" name="deadline">
        </div>

        <div class="form-group">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="3"></textarea>
        </div>

        <button type="submit" class="btn-primary btn-full">Add Item</button>
    </form>

    <p class="auth-switch">
        <a href="{{ url_for('seminary_assistant.index') }}">← Back to My Work</a>
    </p>
</section>
{% endblock %}
